# yaml-language-server: $schema=https://moonrepo.dev/schemas/tasks.json
$schema: 'https://moonrepo.dev/schemas/tasks.json'

inheritedBy:
  file: 'tsconfig.json'

fileGroups:
  sources:
    - 'src/**/*'
    - 'package.json'
    - 'tsconfig*.json'
    - '/pnpm-lock.yaml'

tasks:
  format:
    command: 'oxfmt --check'
    inputs:
      - '@group(sources)'

  lint:
    command: 'oxlint --deny-warnings'
    inputs:
      - '@group(sources)'

  typecheck:
    command: 'tsc --noEmit'
    inputs:
      - '@group(sources)'

  test:
    command: 'node --test'
    inputs:
      - '@group(sources)'

  build:
    command: 'tsc --project tsconfig.build.json'
    inputs:
      - '@group(sources)'
    outputs:
      - 'dist'
