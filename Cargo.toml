[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# The engine crates are written for edition 2021. Edition 2024 changes their
# formatting and rejects one pattern, so moving to it is a change of its own.
edition = "2021"
publish = false
version = "0.0.0"

[workspace.dependencies]
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Only DEFLATE, through flate2's pure-Rust backend, so the core builds for
# wasm32-unknown-unknown with no C toolchain. DOCX packages use no other method.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
