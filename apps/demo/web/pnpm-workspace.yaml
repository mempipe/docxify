# The demo installs on its own, outside Mempipe's pnpm workspace, as the
# engine's Cargo workspace does. A hoisted node_modules gives every package a
# fixed path, which the import map in index.html points at.
nodeLinker: hoisted

# Same supply-chain guard as the repository root: only versions published at
# least 3 days ago.
minimumReleaseAge: 4320

allowBuilds:
  # The platform package (@esbuild/<platform>) already holds the binary;
  # the postinstall only checks it.
  esbuild: false
